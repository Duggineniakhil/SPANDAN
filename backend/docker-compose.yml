services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: spandan
      POSTGRES_PASSWORD: spandan
      POSTGRES_DB: spandan
    ports:
      - "5433:5432"   # 5433 on the host so it doesn't clash with a local Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spandan"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
